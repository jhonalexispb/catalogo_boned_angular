<div class="d-flex flex-column align-items-center justify-content-center text-center px-4"
     [class.loading-screen]="fullscreen"
     [class.loading-screen-inline]="!fullscreen">

  @if (empresa.info()?.logo_url) {
    <img [src]="empresa.info()!.logo_url!" alt="" class="loading-screen-logo rounded-3 mb-3" />
  } @else {
    <span class="loading-screen-logo loading-screen-logo-fallback rounded-3 mb-3 d-inline-flex align-items-center justify-content-center">
      <i class="bi bi-capsule text-white" style="font-size:2rem;"></i>
    </span>
  }

  <div class="progress loading-screen-progress mb-3" role="progressbar">
    <div class="progress-bar progress-bar-striped progress-bar-animated bg-brand" style="width:100%"></div>
  </div>

  <p class="text-body-secondary small mb-0 loading-screen-message">{{ currentMessage() }}</p>

</div>
