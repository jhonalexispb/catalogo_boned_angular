@if (visible()) {
  @let ev = event()!;

  <!-- Backdrop -->
  <div class="catalog-modal-backdrop" (click)="close()"></div>

  <!-- Sheet — centrado en pantalla -->
  <div class="catalog-modal-sheet catalog-event-sheet shadow-lg" (click)="$event.stopPropagation()">
    <div class="position-relative">
      <img [src]="ev.image_url" alt="" loading="lazy" />
      <button type="button" class="btn-close btn-close-white position-absolute top-0 end-0 m-2 p-2 rounded-circle"
              style="background-color:rgba(0,0,0,.4);" (click)="close()"></button>
    </div>

    @if (ev.label) {
      <div class="p-3 text-center">
        <h5 class="fw-bold mb-0">{{ ev.label }}</h5>
      </div>
    }
  </div>

  <app-effect-overlay [type]="effect()" />
}
