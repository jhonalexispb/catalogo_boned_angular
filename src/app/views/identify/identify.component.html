<div class="container px-3 pt-4" style="max-width:480px;">

  <div class="text-center mb-4">
    <i class="bi bi-person-badge text-brand" style="font-size:3rem;"></i>
    <h5 class="fw-bold mt-2">Identifícate con tu RUC o DNI</h5>
    <p class="text-body-secondary small">
      Si tu vendedor ya habilitó tu acceso, podrás ver tus precios, recomendaciones
      y enviar pedidos desde el catálogo.
    </p>
  </div>

  <form (ngSubmit)="submit()">
    <div class="mb-3">
      <label class="form-label small text-body-secondary">RUC (11 dígitos) o DNI (8 dígitos)</label>
      <input type="text" inputmode="numeric" maxlength="11" class="form-control form-control-lg text-center"
             placeholder="20123456789 o 12345678"
             [(ngModel)]="documento" name="documento" />
    </div>

    @if (errorMsg()) {
      <div class="alert alert-warning small">{{ errorMsg() }}</div>
    }

    <button type="submit" class="btn btn-brand w-100" [disabled]="!isValid || loading()">
      @if (loading()) {
        <span class="spinner-border spinner-border-sm me-2"></span>
      }
      Continuar
    </button>
  </form>

  @if (empresa.info()?.catalog_whatsapp_number) {
    <button type="button" (click)="requestAccess()"
            class="btn btn-success w-100 mt-2 d-flex align-items-center justify-content-center gap-2">
      <i class="bi bi-whatsapp"></i>
      Solicitar acceso por WhatsApp
    </button>
  }

  <p class="text-center text-body-secondary small mt-4">
    ¿Aún no tienes acceso? Contacta a tu vendedor para habilitarlo.
  </p>
</div>
